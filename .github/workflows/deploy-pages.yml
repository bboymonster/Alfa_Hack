# Сборка и деплой статического фронтенда на GitHub Pages.
# Фронтенд собран с base: './' (относительные пути), поэтому работает и на
# проектном сайте https://<user>.github.io/Alfa_Hack/.
#
# Включение: Settings → Pages → Source: "GitHub Actions". Без backend сайт
# автоматически переключается в автономный демо-режим (src/demoData.js).
name: Check frontend and optionally deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: 01-frontend
      - name: Lint
        run: npm run lint
        working-directory: 01-frontend
      - name: Build
        run: npm run build
        working-directory: 01-frontend
        env:
          VITE_DEMO_MODE: 'true'
      - name: Check Pages configuration
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            let enabled = false;
            try {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages', context.repo);
              enabled = data.build_type === 'workflow';
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('enabled', String(enabled));
            if (!enabled) {
              core.notice('Frontend checks passed. Pages deployment skipped: enable Settings → Pages → GitHub Actions to publish the demo.');
              await core.summary.addHeading('Frontend verified')
                .addRaw('Lint and build passed. GitHub Pages is not configured for Actions; deployment was skipped. Docker runs independently.')
                .write();
            }
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: 01-frontend/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Сборка и деплой статического фронтенда на GitHub Pages.
# Фронтенд собран с base: './' (относительные пути), поэтому работает и на
# проектном сайте https://<user>.github.io/Alfa_Hack/.
#
# Включение: Settings → Pages → Source: "GitHub Actions". Без backend сайт
# автоматически переключается в автономный демо-режим (src/demoData.js).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: 01-frontend
      - name: Build
        run: npm run build
        working-directory: 01-frontend
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 01-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

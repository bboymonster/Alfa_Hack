# ==============================================================================
# 04-infra-db: опциональный стек базы данных (PostgreSQL + Adminer).
#
# ВНИМАНИЕ: основной способ запуска приложения — корневой docker-compose.yml
# (frontend + backend + ai-service). Этот файл поднимает только реляционную БД
# для демонстрации схемы и сидирования (init.sql + seed.py) и не требуется для
# запуска веб-приложения, которое в демо-режиме хранит данные в памяти.
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: alfa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-alfa_news}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-alfa_news}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - alfa-network

  adminer:
    image: adminer:latest
    container_name: alfa-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alfa-network

volumes:
  postgres_data:
    name: alfa_postgres_data

networks:
  alfa-network:
    name: alfa-network
    driver: bridge

# ==============================================================================
# Alfa News Insights — единый способ запуска (жюри / организаторы)
#
#   cp .env.example .env        # (необязательно — есть безопасные значения по умолчанию)
#   docker compose up --build -d
#
# Сервисы:
#   frontend   http://localhost:3000   — интерфейс «Альфа-Бизнес»
#   backend    http://localhost:8000   — FastAPI (Swagger /docs)
#   ai-service http://localhost:8001   — агентная логика (инсайты, чат, RAG)
#
# Без ключа LLM ai-service работает в режиме offline (детерминированные инсайты
# и трассировка агента); с ключом — реальные модели из Приложения 3 ТЗ.
# ==============================================================================

services:
  ai-service:
    build:
      context: ./03-ai-service
      dockerfile: Dockerfile
    container_name: alfa-ai-service
    restart: unless-stopped
    environment:
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL_MAIN: ${AI_LLM_MODEL_MAIN:-qwen/qwen3.6-35b-a3b}
      AI_LLM_MODEL_FAST: ${AI_LLM_MODEL_FAST:-google/gemma-4-26b-a4b-it}
      AI_LLM_MODEL_CHECKER: ${AI_LLM_MODEL_CHECKER:-z-ai/glm-5.3-flash}
      AI_LLM_TIMEOUT_S: ${AI_LLM_TIMEOUT_S:-60}
      AI_LLM_MAX_TOKENS: ${AI_LLM_MAX_TOKENS:-4000}
      AI_LLM_REASONING_ENABLED: ${AI_LLM_REASONING_ENABLED:-false}
      AI_INSIGHT_TIMEOUT_S: ${AI_INSIGHT_TIMEOUT_S:-120}
      AI_CHAT_TIMEOUT_S: ${AI_CHAT_TIMEOUT_S:-90}
      AI_ARTICLES_DIR: /data/articles
      AI_DATASETS_DIR: /data/datasets
      AI_INDEX_DIR: /data/index
      AI_LOG_FORMAT: console
    volumes:
      - ./articles:/data/articles:ro
      - ./datasets:/data/datasets:ro
      - ai_index:/data/index
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - alfa-network

  backend:
    build:
      context: ./02-backend
      dockerfile: Dockerfile
    container_name: alfa-backend
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretjwtkey_change_in_production_1234567890}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TIMEOUT_S: ${AI_SERVICE_TIMEOUT_S:-130}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - alfa-network

  frontend:
    build:
      context: ./01-frontend
      dockerfile: Dockerfile
    container_name: alfa-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - alfa-network

volumes:
  ai_index:
    name: alfa_ai_index

networks:
  alfa-network:
    name: alfa-network
    driver: bridge
